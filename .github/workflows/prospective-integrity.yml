name: prospective-integrity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install project and test dependencies
        run: >-
          python -m pip install -r requirements.txt -e ".[dev]"
          "scikit-learn>=1.4,<2"
      - name: Clean-checkout compatible test suite
        # Three historical tests require intentionally uncommitted research data:
        # V30's ~717 MB OOS evidence, V6's local market/exposure inputs, and the
        # V3 PDF parse cache.  The complete suite is still required and recorded
        # locally before freezing; CI must not fabricate those missing inputs.
        run: >-
          python -m pytest -q
          --ignore=tests/test_prediction_v30r1.py
          --ignore=tests/test_announcement_body_v3.py
          -k "not parent_lock_artifacts_remain_intact"
      - name: Verify committed V1r2 freeze surface
        run: >-
          python -c "import hashlib,json,pathlib;
          root=pathlib.Path('.'); lock=root/'artifacts/prospective_alpha_v1r2/plan.lock.json';
          digest=lambda p: hashlib.sha256(p.read_bytes()).hexdigest();
          expected=(lock.with_suffix(lock.suffix+'.sha256')).read_text().strip();
          assert digest(lock)==expected, 'V1r2 lock sidecar mismatch';
          payload=json.loads(lock.read_text());
          bad=[name for name,value in payload['files'].items() if not (root/name).exists() or digest(root/name)!=value];
          assert not bad, 'committed V1r2 freeze mismatch: '+str(bad)"
      - name: Run V1r3 certification tests explicitly
        run: python -m pytest -q tests/test_prospective_alpha_v1r3.py
      - name: Verify committed V1r3 freeze and parent surface
        run: >-
          python -c "import hashlib,json,pathlib;
          root=pathlib.Path('.'); lock=root/'artifacts/prospective_alpha_v1r3/plan.lock.json';
          digest=lambda p: hashlib.sha256(p.read_bytes()).hexdigest();
          expected=(lock.with_suffix(lock.suffix+'.sha256')).read_text().strip();
          assert digest(lock)==expected, 'V1r3 lock sidecar mismatch';
          payload=json.loads(lock.read_text());
          bad=[name for name,value in payload['files'].items() if not (root/name).exists() or digest(root/name)!=value];
          assert not bad, 'committed V1r3 freeze mismatch: '+str(bad)"
      - name: Run V1r4 operational closure tests explicitly
        run: python -m pytest -q tests/test_prospective_alpha_v1r4.py
      - name: Verify committed V1r4 freeze and parent surface
        run: >-
          python -c "import hashlib,json,pathlib;
          root=pathlib.Path('.'); lock=root/'artifacts/prospective_alpha_v1r4/plan.lock.json';
          digest=lambda p: hashlib.sha256(p.read_bytes()).hexdigest();
          expected=(lock.with_suffix(lock.suffix+'.sha256')).read_text().strip();
          assert digest(lock)==expected, 'V1r4 lock sidecar mismatch';
          payload=json.loads(lock.read_text());
          bad=[name for name,value in payload['files'].items() if not (root/name).exists() or digest(root/name)!=value];
          assert not bad, 'committed V1r4 freeze mismatch: '+str(bad)"
      - name: Run V31 research challenger tests explicitly
        run: python -m pytest -q tests/test_research_challenger_v31.py
      - name: Verify committed V31 protocol and code lock
        run: >-
          python -c "import hashlib,json,pathlib;
          root=pathlib.Path('.'); lock=root/'artifacts/research_v31/experiments/002_ci_verifier_fix/plan.lock.json';
          digest=lambda p: hashlib.sha256(p.read_bytes()).hexdigest();
          expected=(lock.with_suffix(lock.suffix+'.sha256')).read_text().strip();
          assert digest(lock)==expected, 'V31 lock sidecar mismatch';
          payload=json.loads(lock.read_text());
          bad=[name for name,value in payload['files'].items() if not (root/name).exists() or digest(root/name)!=value];
          assert not bad, 'committed V31 freeze mismatch: '+str(bad)"
      - name: Run Gen2 runtime 009 and self-verification 010 tests explicitly
        run: >-
          python -m pytest -q
          tests/test_research_challenger_gen2_runtime_009.py
          tests/test_research_challenger_gen2_runtime_lock_activation.py
      - name: Verify effective Gen2 operational runtime lock
        run: >-
          python -m stockpilot.research_challenger.prospective_gen2_runtime_locked verify
